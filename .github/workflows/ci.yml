name: CI - Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload restore MATTAR.LocalAi.sln

      - name: Restore
        run: dotnet restore MATTAR.LocalAi.sln

      - name: Build
        run: dotnet build MATTAR.LocalAi.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MATTAR.LocalAi.sln --no-build --configuration Release --verbosity normal
